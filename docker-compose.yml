# =============================================================================
# Vibeforce Flow OS — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up -d          → Start all services
#   docker compose logs -f        → Follow logs
#   docker compose down           → Stop all services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — PocketBase
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeforce-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    volumes:
      - pb-data:/pb/pb_data
    ports:
      - "8090:8080"
    networks:
      - vibeforce
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Frontend — Next.js (development)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POCKETBASE_URL: ${NEXT_PUBLIC_POCKETBASE_URL}
        NEXT_PUBLIC_DEFAULT_HOURLY_RATE: ${NEXT_PUBLIC_DEFAULT_HOURLY_RATE:-150}
    container_name: vibeforce-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
    ports:
      - "3000:3000"
    networks:
      - vibeforce
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

volumes:
  pb-data:
    driver: local

networks:
  vibeforce:
    driver: bridge
