# =============================================================================
# Vibeforce One — Dual-Stack Production & Local Docker Compose
# Single Engine Architecture: Flow OS (Agency) & Craft OS (Handwerk)
# =============================================================================
# Usage:
#   docker compose up -d --build     → Start both Flow OS and Craft OS stacks
#   docker compose up -d frontend-flow backend-flow    → Flow OS only
#   docker compose up -d frontend-craft backend-craft  → Craft OS only
# =============================================================================

services:
  # ===========================================================================
  # STACK 1: FLOW OS (Agency & Digital Service Provider)
  # ===========================================================================

  backend-flow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeforce-backend-flow
    restart: unless-stopped
    environment:
      - PORT=8080
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?PB_ADMIN_EMAIL is required}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?PB_ADMIN_PASSWORD is required}
      - ALLOWED_ORIGINS=*
    volumes:
      - pb-data-flow:/pb/pb_data
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vibeforce-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  frontend-flow:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: agency
        NEXT_PUBLIC_POCKETBASE_URL: http://localhost:8090
        NEXT_PUBLIC_DEFAULT_HOURLY_RATE: 150
    container_name: vibeforce-frontend-flow
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_MODE=agency
      - POCKETBASE_URL=http://backend-flow:8080
      - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8090
      - POCKETBASE_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?PB_ADMIN_EMAIL is required}
      - POCKETBASE_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?PB_ADMIN_PASSWORD is required}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend-flow:
        condition: service_healthy
    networks:
      - vibeforce-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # ===========================================================================
  # STACK 2: CRAFT OS (Handwerk & Bauleitung)
  # ===========================================================================

  backend-craft:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeforce-backend-craft
    restart: unless-stopped
    environment:
      - PORT=8080
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?PB_ADMIN_EMAIL is required}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?PB_ADMIN_PASSWORD is required}
      - ALLOWED_ORIGINS=*
    volumes:
      - pb-data-craft:/pb/pb_data
    ports:
      - "8091:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vibeforce-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  frontend-craft:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: craft
        NEXT_PUBLIC_POCKETBASE_URL: http://localhost:8091
        NEXT_PUBLIC_DEFAULT_HOURLY_RATE: 78
    container_name: vibeforce-frontend-craft
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_MODE=craft
      - POCKETBASE_URL=http://backend-craft:8080
      - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8091
      - POCKETBASE_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?PB_ADMIN_EMAIL is required}
      - POCKETBASE_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?PB_ADMIN_PASSWORD is required}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend-craft:
        condition: service_healthy
    networks:
      - vibeforce-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

volumes:
  pb-data-flow:
    driver: local
  pb-data-craft:
    driver: local

networks:
  vibeforce-net:
    driver: bridge
