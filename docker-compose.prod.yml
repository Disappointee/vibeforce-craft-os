# =============================================================================
# Vibeforce Flow OS — Docker Compose (Production with Traefik v3 & SSL)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy — Traefik v3 (SSL / Let's Encrypt / Load Balancing)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: vibeforce-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      # Secure dashboard router (optional auth)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-vibeforce-flow.de}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ---------------------------------------------------------------------------
  # Backend — PocketBase
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeforce-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?PB_ADMIN_EMAIL is required}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?PB_ADMIN_PASSWORD is required}
      # CORS: konkrete Origins (Komma-getrennt), kein '*' — von den pb_hooks ausgewertet
      - CORS_ORIGIN=https://${DOMAIN:-vibeforce-flow.de},https://pb.${DOMAIN:-vibeforce-flow.de}
      # PocketBase --origins (entrypoint.sh, Fail-fast): konkrete Origins, kein '*'
      - ALLOWED_ORIGINS=https://${DOMAIN:-vibeforce-flow.de},https://pb.${DOMAIN:-vibeforce-flow.de},https://vibeforce-flow-os.vercel.app,https://vibeforce-craft-os-five.vercel.app
    volumes:
      - pb-data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`pb.${DOMAIN:-vibeforce-flow.de}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 16 Standalone
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POCKETBASE_URL: https://pb.${DOMAIN:-vibeforce-flow.de}
        NEXT_PUBLIC_DEFAULT_HOURLY_RATE: ${NEXT_PUBLIC_DEFAULT_HOURLY_RATE:-150}
    container_name: vibeforce-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://${DOMAIN:-vibeforce-flow.de}
      - POCKETBASE_URL=http://backend:8080
      - NEXT_PUBLIC_POCKETBASE_URL=https://pb.${DOMAIN:-vibeforce-flow.de}
      - POCKETBASE_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-vibeforce-flow.de}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  pb-data:
    driver: local
  letsencrypt-data:
    driver: local

networks:
  vibeforce-net:
    driver: bridge
