# =============================================================================
# Vibeforce — Docker Compose (Production with Traefik v3 & SSL)
# Two PocketBase instances: pb-flow and pb-craft
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy — Traefik v3 (SSL / Let's Encrypt / Load Balancing)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: vibeforce-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-vibeforce-flow.de}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pb-flow.rule=Host(`pb-flow.vibeforce.46-225-178-235.sslip.io`)"
      - "traefik.http.routers.pb-flow.entrypoints=websecure"
      - "traefik.http.routers.pb-flow.tls=true"
      - "traefik.http.routers.pb-flow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pb-craft.rule=Host(`pb-craft.vibeforce.46-225-178-235.sslip.io`)"
      - "traefik.http.routers.pb-craft.entrypoints=websecure"
      - "traefik.http.routers.pb-craft.tls=true"
      - "traefik.http.routers.pb-craft.tls.certresolver=letsencrypt"

  # ---------------------------------------------------------------------------
  # Backend — PocketBase pb-flow
  # ---------------------------------------------------------------------------
  pb-flow:
    image: pocketbase/pocketbase:latest
    container_name: vibeforce-pb-flow
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=https://vibeforce-flow-os.vercel.app,https://rl-showcase.vercel.app
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL_FLOW:?PB_ADMIN_EMAIL_FLOW is required}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD_FLOW:?PB_ADMIN_PASSWORD_FLOW is required}
      - DEMO_GUEST_A_EMAIL=demo-flow-a@vibeforce.flow.de
      - DEMO_GUEST_A_PASSWORD=${DEMO_GUEST_A_PASSWORD_FLOW:?}
      - DEMO_GUEST_B_EMAIL=demo-flow-b@vibeforce.flow.de
      - DEMO_GUEST_B_PASSWORD=${DEMO_GUEST_B_PASSWORD_FLOW:?}
      - CORS_ORIGIN=https://vibeforce-flow-os.vercel.app,https://rl-showcase.vercel.app
    volumes:
      - pb-flow-data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pb-flow.rule=Host(`pb-flow.vibeforce.46-225-178-235.sslip.io`)"
      - "traefik.http.routers.pb-flow.entrypoints=websecure"
      - "traefik.http.routers.pb-flow.tls=true"
      - "traefik.http.routers.pb-flow.tls.certresolver=letsencrypt"
      - "traefik.http.services.pb-flow.loadbalancer.server.port=8080"
      - "traefik.http.routers.pb-flow.tls.certresolver=letsencrypt"

  # ---------------------------------------------------------------------------
  # Backend — PocketBase pb-craft
  # ---------------------------------------------------------------------------
  pb-craft:
    image: pocketbase/pocketbase:latest
    container_name: vibeforce-pb-craft
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=https://vibeforce-craft-os.vercel.app,https://craft-vibeforce.vercel.app,https://rl-showcase.vercel.app
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL_CRAFT:?PB_ADMIN_EMAIL_CRAFT is required}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD_CRAFT:?PB_ADMIN_PASSWORD_CRAFT is required}
      - DEMO_GUEST_A_EMAIL=demo-craft-a@vibeforce.craft.de
      - DEMO_GUEST_A_PASSWORD=${DEMO_GUEST_A_PASSWORD_CRAFT:?}
      - DEMO_GUEST_B_EMAIL=demo-craft-b@vibeforce.craft.de
      - DEMO_GUEST_B_PASSWORD=${DEMO_GUEST_B_PASSWORD_CRAFT:?}
      - CORS_ORIGIN=https://vibeforce-craft-os.vercel.app,https://craft-vibeforce.vercel.app,https://rl-showcase.vercel.app
    volumes:
      - pb-craft-data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vibeforce-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pb-craft.rule=Host(`pb-craft.vibeforce.46-225-178-235.sslip.io`)"
      - "traefik.http.routers.pb-craft.entrypoints=websecure"
      - "traefik.http.routers.pb-craft.tls=true"
      - "traefik.http.routers.pb-craft.tls.certresolver=letsencrypt"
      - "traefik.http.services.pb-craft.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - vibeforce-net

  # ---------------------------------------------------------------------------
  # MinIO
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    networks:
      - vibeforce-net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pb-flow-data:
    driver: local
  pb-craft-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  letsencrypt-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  vibeforce-net:
    driver: bridge